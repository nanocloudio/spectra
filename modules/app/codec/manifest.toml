version = "2.0.0"
hardware_targets = ["rp2350", "bcm2712", "wasm"]

# Feature-set variants (RFC module_variants). Build emits one prebuilt
# fmod per variant: the default (`full`) carries the unsuffixed
# `codec.fmod` filename so existing YAMLs resolve unchanged;
# `codec-audio.fmod` is the constrained-target build — no image/video
# code, state union shrinks to the largest audio codec, and
# `module_arena_size` drops from 16 MiB to 64 KiB (the RP2350 win).
# A YAML selects with `variant: audio` on the module entry; wiring
# `codec.pixels` against the audio variant fails at config build
# because the embedded manifest omits the port.
[[variant]]
name = "audio"
features = ["wav", "mp3", "aac"]
omit_ports = ["pixels", "video_in"]

[[variant]]
name = "full"
features = ["wav", "mp3", "aac", "image", "h264"]
default = true

# Exactly one of the three inputs is wired; `module_new` refuses more.
#
# in[0]: a file's bytes — a container or bare essence stream (WAV, MP3, ADTS,
# BMP/GIF/PNG/JPEG, Matroska), identified by sniffing. The bank writes 1024
# bytes per tick; sized for a healthy lead so writes don't stall while the
# image path drains a decoded frame and is not reading.
[[ports]]
name = "encoded"
direction = "input"
content_type = "OctetStream"
buffer_size = 65536

# in[1]: an encoded-media record stream (`abi::contracts::encoded`) — AAC (raw
# with an AudioSpecificConfig, or ADTS) or MP3. The STREAM record names the
# codec, so nothing is sniffed.
[[ports]]
name = "audio_in"
index = 1
direction = "input"
content_type = "AudioEncoded"

[ports.facts]
codec = ["aac", "mp3"]
packing = ["raw", "framed"]
max_payload = 4096

# in[2]: an encoded-media record stream of H.264, Annex B or length-prefixed
# with its avcC. Not in the `audio` variant.
[[ports]]
name = "video_in"
index = 2
direction = "input"
content_type = "VideoEncoded"

[ports.facts]
codec = "h264"
packing = ["annexb", "length_prefixed"]
max_payload = 4096

[[ports]]
name = "audio"
direction = "output"
content_type = "AudioSample"
# Request a generous output buffer so a 4-second test asset's worth of
# PCM (≈720 KB) can buffer through to a slow consumer (e.g. a WS client
# that connects ~2 s after the source pipeline starts). With the default
# 8 KB buffer the codec backpressures within ~2 frames; downstream
# (`ws_stream` → `http`) would then either drop pre-connect bytes at the
# no-fan-out gate or stall. 1 MiB fits any single-asset test plus several
# seconds of live decode at typical bitrates.
buffer_size = 1048576
# Largest single channel_write across the audio sub-codecs:
# aac_codec.rs IO_BUF_SIZE = 4096 (mp3 caps chunks at 2048, wav at
# WAV_IO_BUF_SIZE = 256).
max_record = 4096

[[ports]]
name = "pixels"
direction = "output"
content_type = "VideoRaster"
# Pixels output — video frames are dst_w*dst_h*2 bytes per frame; give
# the consumer a healthy lead.
buffer_size = 1048576
# Largest WRITE_CHUNK across the sub-codecs that share this port:
# video/mod.rs WRITE_CHUNK = 16384 (image/mod.rs WRITE_CHUNK = 1024).
max_record = 16384

# Module-scope observability — exempt (see standards/observability.md §6).
[observability]
exempt = "audio/media-sample path — meaningful throughput is sample-rate (Hz·channels), not byte count; off-device bytes are observed at the network transport"

